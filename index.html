<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grid Gauntlet</title>

    <style>
        /* Global Styles */
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-user-select: none; /* Disable text selection on iOS */
            -ms-user-select: none;
            user-select: none;
            touch-action: none; /* Prevent browser default touch actions like pinch-zoom */
        }

        canvas {
            background-color: #333;
            border: 2px solid #555;
            display: block;
            image-rendering: pixelated; /* Sharp pixels for retro feel */
            max-width: 95vw; /* Ensure canvas fits on smaller screens */
            max-height: 95vh;
        }

        #game-info {
            margin-top: 10px;
            font-size: 1.2em;
            text-align: center;
            padding: 5px;
        }

        #instructions {
            margin: 20px;
            font-size: 0.9em;
            max-width: 80vw;
            text-align: center;
            opacity: 0.8;
        }

        #restart-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        #restart-btn:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }
        #restart-btn:active {
            background-color: #004085;
            transform: translateY(1px);
        }

        /* Responsive adjustments for very small screens */
        @media (max-width: 400px) {
            #game-info {
                font-size: 1em;
            }
            #instructions {
                font-size: 0.8em;
                margin: 10px;
            }
            #restart-btn {
                padding: 10px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="game-info">
        Level: <span id="level-display">1</span> | Score: <span id="score-display">0</span>
    </div>
    <button id="restart-btn">Restart Level</button>
    <div id="instructions">
        Swipe anywhere on the screen to move the blue square. Avoid red blocks and green enemies. Reach the yellow exit to advance!
    </div>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 25; // Cells per side (e.g., 25x25 grid)
        const CELL_SIZE = 20; // Pixels per cell. Will be adjusted for responsiveness.
        let actualCellSize; // Dynamic cell size based on screen
        const PLAYER_COLOR = '#007bff'; // Blue
        const OBSTACLE_COLOR = '#dc3545'; // Red
        const ENEMY_COLOR = '#28a745'; // Green
        const EXIT_COLOR = '#ffc107'; // Yellow
        const GRID_COLOR = '#444'; // For grid lines
        const BACKGROUND_COLOR = '#333';

        const OBSTACLE_COUNT = 0.1; // Percentage of cells that are obstacles
        const ENEMY_COUNT = 0.02; // Percentage of cells that are enemies (or number per level)
        const ENEMY_MOVE_INTERVAL = 400; // ms between enemy moves
        const PLAYER_MOVE_DURATION = 100; // ms for player movement animation

        // --- Game State ---
        let canvas, ctx;
        let gameActive = false;
        let gameGrid = []; // 2D array representing the game board
        let player = { x: 0, y: 0 };
        let exit = { x: 0, y: 0 };
        let enemies = [];
        let level = 1;
        let score = 0;
        let playerMoving = false; // To prevent multiple moves at once
        let lastEnemyMoveTime = 0;
        let lastPlayerMoveTime = 0;

        // Touch input variables
        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_THRESHOLD = 50; // Minimum pixels for a swipe

        // DOM elements
        let levelDisplay, scoreDisplay, restartButton;

        // --- Game Initialization ---
        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            levelDisplay = document.getElementById('level-display');
            scoreDisplay = document.getElementById('score-display');
            restartButton = document.getElementById('restart-btn');

            setupCanvas();
            addEventListeners();
            resetGame(true); // Start the first level
            gameLoop();
        }

        function setupCanvas() {
            // Calculate actual cell size based on screen dimensions
            const maxCanvasWidth = Math.min(window.innerWidth * 0.95, window.innerHeight * 0.95);
            actualCellSize = Math.floor(maxCanvasWidth / GRID_SIZE);
            if (actualCellSize < 5) actualCellSize = 5; // Minimum size
            if (actualCellSize > CELL_SIZE) actualCellSize = CELL_SIZE; // Max cap

            canvas.width = GRID_SIZE * actualCellSize;
            canvas.height = GRID_SIZE * actualCellSize;
        }

        function addEventListeners() {
            window.addEventListener('resize', setupCanvas); // Responsive canvas

            // Touch controls
            canvas.addEventListener('touchstart', handleTouchStart, false);
            canvas.addEventListener('touchmove', handleTouchMove, false);
            canvas.addEventListener('touchend', handleTouchEnd, false);
            canvas.addEventListener('contextmenu', e => e.preventDefault()); // Prevent long-press context menu

            // Keyboard controls (for desktop testing or if external keyboard used)
            window.addEventListener('keydown', handleKeyDown);

            restartButton.addEventListener('click', () => resetGame(false)); // Restart current level
        }

        // --- Level Generation ---
        function generateLevel() {
            gameGrid = Array.from({ length: GRID_SIZE }, () =>
                Array.from({ length: GRID_SIZE }, () => 0) // 0: empty, 1: obstacle, 2: enemy
            );
            enemies = [];

            // Place player at top-left
            player.x = 0;
            player.y = 0;
            gameGrid[player.y][player.x] = 'P'; // Mark player position

            // Place exit at bottom-right
            exit.x = GRID_SIZE - 1;
            exit.y = GRID_SIZE - 1;
            gameGrid[exit.y][exit.x] = 'E'; // Mark exit position

            // Randomly place obstacles
            const numObstacles = Math.floor(GRID_SIZE * GRID_SIZE * OBSTACLE_COUNT);
            for (let i = 0; i < numObstacles; i++) {
                let ox, oy;
                do {
                    ox = Math.floor(Math.random() * GRID_SIZE);
                    oy = Math.floor(Math.random() * GRID_SIZE);
                } while (gameGrid[oy][ox] !== 0 || (ox === player.x && oy === player.y) || (ox === exit.x && oy === exit.y));
                gameGrid[oy][ox] = 1; // Obstacle
            }

            // Randomly place enemies
            const numEnemies = Math.floor(GRID_SIZE * GRID_SIZE * ENEMY_COUNT);
            for (let i = 0; i < numEnemies; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * GRID_SIZE);
                    ey = Math.floor(Math.random() * GRID_SIZE);
                } while (gameGrid[ey][ex] !== 0 || (ex === player.x && ey === player.y) || (ex === exit.x && ey === exit.y));
                gameGrid[ey][ex] = 2; // Enemy
                enemies.push({ x: ex, y: ey, dx: 0, dy: 0 }); // Enemies start static
            }

            // Simple path check: ensure start/end are not immediately blocked by a solid wall of obstacles
            // This is not a full maze solver, just prevents impossible levels from the start
            if (!isPathPossible(player.x, player.y, exit.x, exit.y)) {
                console.log("Generated potentially unsolvable level, regenerating...");
                generateLevel(); // Regenerate if basic path is blocked
            }
        }

        // Basic BFS for path checking (simplified to check *any* path)
        function isPathPossible(startX, startY, targetX, targetY) {
            const queue = [{x: startX, y: startY}];
            const visited = new Set();
            visited.add(`${startX},${startY}`);

            while (queue.length > 0) {
                const {x, y} = queue.shift();

                if (x === targetX && y === targetY) {
                    return true;
                }

                const neighbors = [
                    {dx: 0, dy: -1}, // Up
                    {dx: 0, dy: 1},  // Down
                    {dx: -1, dy: 0}, // Left
                    {dx: 1, dy: 0}   // Right
                ];

                for (const {dx, dy} of neighbors) {
                    const nx = x + dx;
                    const ny = y + dy;

                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE &&
                        gameGrid[ny][nx] !== 1 && // Not an obstacle
                        !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        queue.push({x: nx, y: ny});
                    }
                }
            }
            return false;
        }

        // --- Game Loop and Updates ---
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!gameActive) return;

            const now = Date.now();

            // Player animation update
            if (playerMoving && now - lastPlayerMoveTime >= PLAYER_MOVE_DURATION) {
                playerMoving = false;
            }

            // Enemy movement
            if (now - lastEnemyMoveTime >= ENEMY_MOVE_INTERVAL) {
                moveEnemies();
                lastEnemyMoveTime = now;
            }

            checkCollisions();
            checkWinCondition();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = BACKGROUND_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = GRID_COLOR;
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * actualCellSize, 0);
                ctx.lineTo(i * actualCellSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * actualCellSize);
                ctx.lineTo(canvas.width, i * actualCellSize);
                ctx.stroke();
            }

            // Draw game elements
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cellValue = gameGrid[y][x];
                    if (cellValue === 1) { // Obstacle
                        ctx.fillStyle = OBSTACLE_COLOR;
                        ctx.fillRect(x * actualCellSize, y * actualCellSize, actualCellSize, actualCellSize);
                    }
                }
            }

            // Draw enemies
            enemies.forEach(enemy => {
                ctx.fillStyle = ENEMY_COLOR;
                ctx.fillRect(enemy.x * actualCellSize, enemy.y * actualCellSize, actualCellSize, actualCellSize);
            });

            // Draw exit
            ctx.fillStyle = EXIT_COLOR;
            ctx.fillRect(exit.x * actualCellSize, exit.y * actualCellSize, actualCellSize, actualCellSize);

            // Draw player (maybe slightly smaller for animation effect)
            ctx.fillStyle = PLAYER_COLOR;
            const playerRenderSize = playerMoving ? actualCellSize * 0.8 : actualCellSize;
            const playerRenderOffset = (actualCellSize - playerRenderSize) / 2;
            ctx.fillRect(player.x * actualCellSize + playerRenderOffset,
                         player.y * actualCellSize + playerRenderOffset,
                         playerRenderSize, playerRenderSize);
        }

        // --- Game Logic ---
        function movePlayer(dx, dy) {
            if (!gameActive || playerMoving) return;

            const newX = player.x + dx;
            const newY = player.y + dy;

            if (newX >= 0 && newX < GRID_SIZE &&
                newY >= 0 && newY < GRID_SIZE &&
                gameGrid[newY][newX] !== 1) // Not an obstacle
            {
                player.x = newX;
                player.y = newY;
                playerMoving = true;
                lastPlayerMoveTime = Date.now();
                score++; // Increment score for each move
                updateDisplay();
            }
        }

        function moveEnemies() {
            enemies.forEach(enemy => {
                // Simple random movement: try to move one step in a random direction
                const possibleMoves = [
                    { dx: 0, dy: -1 }, { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 }, { dx: 1, dy: 0 }
                ];
                const move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

                const newX = enemy.x + move.dx;
                const newY = enemy.y + move.dy;

                // Check boundaries and no collisions with obstacles or player
                if (newX >= 0 && newX < GRID_SIZE &&
                    newY >= 0 && newY < GRID_SIZE &&
                    gameGrid[newY][newX] !== 1 && // Not an obstacle
                    !(newX === player.x && newY === player.y)) // Not on player's current spot
                {
                    enemy.x = newX;
                    enemy.y = newY;
                }
            });
        }

        function checkCollisions() {
            enemies.forEach(enemy => {
                if (player.x === enemy.x && player.y === enemy.y) {
                    gameOver();
                }
            });
        }

        function checkWinCondition() {
            if (player.x === exit.x && player.y === exit.y) {
                levelUp();
            }
        }

        function gameOver() {
            gameActive = false;
            alert(`Game Over! You reached Level ${level} with a score of ${score}.`);
            level = 1;
            score = 0;
            resetGame(true); // Restart from level 1
        }

        function levelUp() {
            gameActive = false; // Pause game for a moment
            level++;
            alert(`Level ${level-1} Complete! Get ready for Level ${level}!`);
            resetGame(true);
        }

        function resetGame(newLevelOnly) {
            gameActive = false; // Pause rendering briefly
            if (newLevelOnly) {
                generateLevel();
            } else { // Restart current level
                // Player and enemies reset to initial positions for this specific level's generation
                const currentLevelEnemies = JSON.parse(JSON.stringify(enemies)); // Deep copy
                generateLevel(); // Re-generates everything
                // This means 'restart level' generates a *new* level, not the *same* level again.
                // For a true 'restart same level', you'd need to save the initial level state.
                // For "one-file" and "endless levels," regenerating is simpler and fits the theme.
            }
            updateDisplay();
            gameActive = true;
        }

        function updateDisplay() {
            levelDisplay.textContent = level;
            scoreDisplay.textContent = score;
        }

        // --- Input Handlers ---
        function handleTouchStart(e) {
            e.preventDefault(); // Prevent scrolling/zooming
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchMove(e) {
            e.preventDefault(); // Prevent scrolling/zooming during swipe
        }

        function handleTouchEnd(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) { // Horizontal swipe
                if (Math.abs(dx) > SWIPE_THRESHOLD) {
                    if (dx > 0) movePlayer(1, 0); // Right
                    else movePlayer(-1, 0); // Left
                }
            } else { // Vertical swipe
                if (Math.abs(dy) > SWIPE_THRESHOLD) {
                    if (dy > 0) movePlayer(0, 1); // Down
                    else movePlayer(0, -1); // Up
                }
            }
        }

        function handleKeyDown(e) {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                    movePlayer(1, 0);
                    break;
            }
        }

        // Initialize the game when the window loads
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
